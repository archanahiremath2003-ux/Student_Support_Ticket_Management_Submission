{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h3>Change password</h3>
    <form method="post" class="card card-body shadow-sm">
      {{ csrf_field() }}
      <label class="form-label" for="current">Current password</label>
      <input class="form-control mb-3" type="password" id="current" name="current" required>
      <label class="form-label" for="password">New password (at least 8 characters)</label>
      <input class="form-control mb-3" type="password" id="password" name="password" required minlength="8">
      <label class="form-label" for="confirm">Confirm new password</label>
      <input class="form-control mb-3" type="password" id="confirm" name="confirm" required>
      <button class="btn btn-primary">Save password</button>
    </form>
  </div>
</div>
{% endblock %}
